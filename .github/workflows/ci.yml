name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc, vitest, vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  rust-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build requires frontendDist (../dist) to exist; tests don't need the real bundle.
      - run: mkdir -p dist
      # Serial: several tests assert wall-clock latency, which parallel tests on a
      # small shared runner distort. The whole suite still takes ~15s.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

  rust-windows:
    name: Rust tests (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir dist -Force
        shell: pwsh
      # Serial: several tests assert wall-clock latency, which parallel tests on a
      # small shared runner distort. The whole suite still takes ~15s.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test -- --test-threads=1
